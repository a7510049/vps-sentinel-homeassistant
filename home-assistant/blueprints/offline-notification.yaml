blueprint:
  name: "VPS Sentinel｜主機離線通知"
  description: >
    VPS Sentinel 回報離線時立即執行通知動作，重新連線後可選擇是否通知。
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    offline_entity:
      name: VPS 連線狀態
      selector:
        entity:
          filter:
            - domain: binary_sensor
    offline_actions:
      name: 離線時執行
      selector:
        action: {}
    online_actions:
      name: 恢復連線時執行
      default: []
      selector:
        action: {}

mode: queued
max: 5

triggers:
  - trigger: state
    entity_id: !input offline_entity
    from: "off"
    to: "on"
    id: offline
  - trigger: state
    entity_id: !input offline_entity
    from: "on"
    to: "off"
    for: "00:01:00"
    id: online

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: offline
        sequence: !input offline_actions
      - conditions:
          - condition: trigger
            id: online
        sequence: !input online_actions
