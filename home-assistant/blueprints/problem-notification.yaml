blueprint:
  name: "VPS Sentinel｜系統異常通知"
  description: >
    當選取的 VPS 異常狀態持續兩分鐘時執行通知動作，恢復正常時可選擇
    是否再次通知。適合資源過載、磁碟空間與服務異常。
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    problem_entities:
      name: 要監看的異常狀態
      description: 可複選系統負載、磁碟空間與服務運作狀態。
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    problem_actions:
      name: 異常時執行
      description: 選擇傳送到手機的通知動作。
      selector:
        action: {}
    recovery_actions:
      name: 恢復正常時執行
      description: 不需要恢復通知時可以留白。
      default: []
      selector:
        action: {}

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input problem_entities
    from: "off"
    to: "on"
    for: "00:02:00"
    id: problem
  - trigger: state
    entity_id: !input problem_entities
    from: "on"
    to: "off"
    for: "00:01:00"
    id: recovery

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: problem
        sequence: !input problem_actions
      - conditions:
          - condition: trigger
            id: recovery
        sequence: !input recovery_actions
