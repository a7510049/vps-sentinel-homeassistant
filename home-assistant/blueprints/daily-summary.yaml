blueprint:
  name: "VPS Sentinel｜每日健康摘要"
  description: >
    每天在指定時間執行摘要動作。通知內容可在動作中引用下方選取的感測器。
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    summary_time:
      name: 發送時間
      default: "09:00:00"
      selector:
        time: {}
    cpu_entity:
      name: CPU 使用率
      selector:
        entity:
          filter:
            - domain: sensor
    memory_entity:
      name: 記憶體使用率
      selector:
        entity:
          filter:
            - domain: sensor
    disk_entity:
      name: 磁碟使用率
      selector:
        entity:
          filter:
            - domain: sensor
    updates_entity:
      name: 待安裝安全更新
      selector:
        entity:
          filter:
            - domain: sensor
    summary_actions:
      name: 摘要通知動作
      description: >
        建立通知內容時可使用變數 cpu、memory、disk 與 updates。
      selector:
        action: {}

mode: single

variables:
  cpu_entity: !input cpu_entity
  memory_entity: !input memory_entity
  disk_entity: !input disk_entity
  updates_entity: !input updates_entity
  cpu: "{{ states(cpu_entity) }}"
  memory: "{{ states(memory_entity) }}"
  disk: "{{ states(disk_entity) }}"
  updates: "{{ states(updates_entity) }}"

triggers:
  - trigger: time
    at: !input summary_time

actions: !input summary_actions
