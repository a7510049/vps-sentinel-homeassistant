name: Reorganize repository structure

on:
  push:
    branches:
      - chore/reorganize-project-structure

permissions:
  contents: write

jobs:
  reorganize:
    if: ${{ !contains(github.event.head_commit.message, '[structure-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move operational scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p scripts
          for file in apple-dashboard.sh automations.sh backup.sh doctor.sh manage.sh uninstall.sh update.sh upgrade.sh; do
            git mv "$file" "scripts/$file"
          done

      - name: Update repository references
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          scripts = [
              'apple-dashboard.sh', 'automations.sh', 'backup.sh', 'doctor.sh',
              'manage.sh', 'uninstall.sh', 'update.sh', 'upgrade.sh',
          ]

          replacements = {}
          for name in scripts:
              replacements.update({
                  f'${{REPO_DIR}}/{name}': f'${{REPO_DIR}}/scripts/{name}',
                  f'${{source_dir}}/{name}': f'${{source_dir}}/scripts/{name}',
                  f'ROOT / "{name}"': f'ROOT / "scripts" / "{name}"',
                  f'ROOT / \'{name}\'': f'ROOT / "scripts" / \'{name}\'',
                  f'`{name}`': f'`scripts/{name}`',
                  f']({name})': f'](scripts/{name})',
              })

          # CI command lists contain bare repository paths.
          for name in scripts:
              replacements[f' {name}'] = f' scripts/{name}'

          text_suffixes = {'.sh', '.py', '.yml', '.yaml', '.md', '.txt'}
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix not in text_suffixes and path.name not in {'README', 'VERSION'}:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')

          # setup.sh remains the stable public entry point at repository root.
          setup = Path('setup.sh')
          text = setup.read_text(encoding='utf-8')
          for name in scripts:
              text = text.replace(f'${{REPO_DIR}}/{name}', f'${{REPO_DIR}}/scripts/{name}')
          setup.write_text(text, encoding='utf-8')

          # The upgrade archive now stores operational scripts below scripts/.
          upgrade = Path('scripts/upgrade.sh')
          text = upgrade.read_text(encoding='utf-8')
          for name in scripts:
              text = text.replace(f'${{source_dir}}/{name}', f'${{source_dir}}/scripts/{name}')
          upgrade.write_text(text, encoding='utf-8')

      - name: Document script layout
        shell: bash
        run: |
          cat > scripts/README.md <<'EOF'
          # Operational scripts

          Repository-internal maintenance and Home Assistant tooling lives here so the project root stays focused on the public entry points.

          Users should normally start with the root-level `setup.sh`. During installation, these scripts are copied to their stable `/usr/local/sbin/vps-sentinel-*` commands, so existing installed commands do not change.

          | Script | Purpose |
          | --- | --- |
          | `manage.sh` | Maintenance center and command router |
          | `doctor.sh` | Health checks and diagnostics |
          | `backup.sh` | Backup, restore, and retention |
          | `automations.sh` | Home Assistant Blueprint installation |
          | `apple-dashboard.sh` | Apple-style dashboard installation |
          | `update.sh` | Home Assistant container update |
          | `upgrade.sh` | VPS Sentinel release upgrade |
          | `uninstall.sh` | Safe partial or complete removal |
          EOF

      - name: Validate structure
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n setup.sh scripts/*.sh vps-monitor/install.sh
          python -m compileall -q vps-monitor tests
          python -m unittest discover -s tests -v
          git diff --check
          test ! -e manage.sh
          test -f scripts/manage.sh

      - name: Commit reorganized tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/reorganize-structure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: organize operational scripts [structure-done]"
          git push origin HEAD:chore/reorganize-project-structure
