name: Finish structure migration

on:
  push:
    branches:
      - chore/reorganize-project-structure-v2

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/reorganize-project-structure-v2
          fetch-depth: 0

      - name: Update moved script paths
        shell: python
        run: |
          from pathlib import Path

          names = [
              'apple-dashboard.sh', 'automations.sh', 'backup.sh', 'doctor.sh',
              'manage.sh', 'uninstall.sh', 'update.sh', 'upgrade.sh',
          ]

          replacements = {}
          for name in names:
              replacements[f'${{REPO_DIR}}/{name}'] = f'${{REPO_DIR}}/scripts/{name}'
              replacements[f'${{source_dir}}/{name}'] = f'${{source_dir}}/scripts/{name}'
              replacements[f'ROOT / "{name}"'] = f'ROOT / "scripts" / "{name}"'
              replacements[f'ROOT / \'{name}\''] = f'ROOT / "scripts" / \'{name}\''

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path == Path('.github/workflows/finish-structure-migration.yml'):
                  continue
              if path.suffix not in {'.sh', '.py', '.yml', '.yaml', '.md'}:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')

      - name: Validate migrated repository
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n setup.sh scripts/*.sh vps-monitor/install.sh
          shellcheck setup.sh scripts/*.sh vps-monitor/install.sh
          python3 -m pip install -r vps-monitor/requirements.txt
          python3 -m unittest discover -s tests -v
          python3 -m py_compile vps-monitor/vps_monitor.py tests/test_vps_monitor.py tests/test_command_interface.py
          git diff --check
          grep -R --line-number --exclude-dir=.git --exclude=finish-structure-migration.yml \
            -E '\$\{REPO_DIR\}/(apple-dashboard|automations|backup|doctor|manage|uninstall|update|upgrade)\.sh|\$\{source_dir\}/(apple-dashboard|automations|backup|doctor|manage|uninstall|update|upgrade)\.sh' \
            . && exit 1 || true

      - name: Commit migration fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: update references for scripts directory"
          git push origin HEAD:chore/reorganize-project-structure-v2

# Triggered after the workflow was present on the branch.
