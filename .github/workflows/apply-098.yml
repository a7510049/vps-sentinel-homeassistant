name: Apply 0.9.8 preparation

on:
  push:
    branches:
      - release/0.9.8-stability
    paths:
      - .github/workflows/apply-098.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/0.9.8-stability
          fetch-depth: 0

      - name: Apply release patches
        run: python3 tools/apply_098.py

      - name: Validate generated changes
        run: |
          bash -n setup.sh scripts/*.sh vps-monitor/install.sh
          shellcheck setup.sh scripts/*.sh vps-monitor/install.sh
          node --check home-assistant/www/vps-sentinel-apple-card.js
          python3 -m pip install -r vps-monitor/requirements.txt
          python3 -m unittest discover -s tests -v
          git diff --check

      - name: Commit prepared release
        run: |
          rm -f tools/apply_098.py .github/workflows/apply-098.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare VPS Sentinel 0.9.8"
          git push origin HEAD:release/0.9.8-stability
