name: Apply project audit fixes

on:
  push:
    branches:
      - fix/project-audit-2026-07-31

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/project-audit-2026-07-31
          fetch-depth: 0

      - name: Apply audited fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(
                      f"Expected exactly one match in {path_name}, found {text.count(old)}: {old!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/manage.sh",
              '''run_tool() {
            local label="$1" command="$2"
            if [[ ! -x "${command}" ]]; then
              yellow "找不到${label}，請先執行 VPS Sentinel 更新。"
              return 1
            fi
            if ! "${command}"; then
              red "${label}未完成，請查看上方訊息。"
              return 1
            fi
          }
          ''',
              '''run_tool() {
            local label="$1" command="$2"
            shift 2
            if [[ ! -x "${command}" ]]; then
              yellow "找不到${label}，請先執行 VPS Sentinel 更新。"
              return 1
            fi
            if ! "${command}" "$@"; then
              red "${label}未完成，請查看上方訊息。"
              return 1
            fi
          }
          ''',
          )
          replace_once(
              "scripts/manage.sh",
              '''  apple        設定 Apple 風格面板
          ''',
              '''  apple        設定 Apple 風格面板；加上 --apply 套用面板
          ''',
          )
          replace_once(
              "scripts/manage.sh",
              '''run_command() {
            case "${1}" in
              status) show_status ;;
              settings) show_settings ;;
              dashboard) install_dashboard ;;
              apple) run_tool "Apple 風格面板" "${APPLE_COMMAND}" ;;
              doctor) run_tool "健康檢查" "${DOCTOR_COMMAND}" ;;
              backup) run_tool "備份管理" "${BACKUP_COMMAND}" ;;
              upgrade) run_tool "VPS Sentinel 更新" "${UPGRADE_COMMAND}" ;;
              ha-update) run_tool "Home Assistant 更新" "${UPDATE_COMMAND}" ;;
              help|-h|--help) print_help ;;
              *)
                red "未知指令：${1}"
                print_help
                return 2
                ;;
            esac
          }
          ''',
              '''run_command() {
            local command="$1"
            shift
            case "${command}" in
              status) show_status ;;
              settings) show_settings ;;
              dashboard) install_dashboard ;;
              apple) run_tool "Apple 風格面板" "${APPLE_COMMAND}" "$@" ;;
              doctor) run_tool "健康檢查" "${DOCTOR_COMMAND}" ;;
              backup) run_tool "備份管理" "${BACKUP_COMMAND}" ;;
              upgrade) run_tool "VPS Sentinel 更新" "${UPGRADE_COMMAND}" ;;
              ha-update) run_tool "Home Assistant 更新" "${UPDATE_COMMAND}" ;;
              help|-h|--help) print_help ;;
              *)
                red "未知指令：${command}"
                print_help
                return 2
                ;;
            esac
          }
          ''',
          )
          replace_once(
              "scripts/manage.sh",
              '''if (( $# > 0 )); then
            run_command "$1"
          else
          ''',
              '''if (( $# > 0 )); then
            run_command "$@"
          else
          ''',
          )

          replace_once(
              "scripts/apple-dashboard.sh",
              '''完成後執行：
            sudo vps-sentinel-apple --apply
          ''',
              '''完成後執行：
            sudo vps-sentinel apple --apply
          ''',
          )
          replace_once(
              "scripts/apple-dashboard.sh",
              '''if [[ "${1:-}" == "--apply" ]]; then
            apply_dashboard
          else
            show_resource_steps
          fi
          ''',
              '''case "${1:-}" in
            --apply) apply_dashboard ;;
            "") show_resource_steps ;;
            *)
              echo "[錯誤] 未知參數：${1}" >&2
              echo "用法：sudo vps-sentinel apple [--apply]" >&2
              exit 2
              ;;
          esac
          ''',
          )

          replace_once(
              "README.md",
              '''```bash
          sudo vps-sentinel apple
          ```

          完整安裝說明請參考：
          ''',
              '''```bash
          sudo vps-sentinel apple
          ```

          第一次執行會安裝前端元件，並顯示 Home Assistant 資源註冊方式。完成資源註冊後，再套用面板：

          ```bash
          sudo vps-sentinel apple --apply
          ```

          完整安裝說明請參考：
          ''',
          )
          replace_once(
              "README.md",
              '''| 套用 Apple 風格面板 | `sudo vps-sentinel apple` |
          ''',
              '''| 安裝 Apple 面板元件／查看設定步驟 | `sudo vps-sentinel apple` |
          | 套用 Apple 風格面板 | `sudo vps-sentinel apple --apply` |
          ''',
          )
          replace_once(
              "README.md",
              '''```text
          .
          ├── setup.sh                         # 一條龍安裝入口
          ├── scripts/                         # 維護、更新、備份與移除工具
          ''',
              '''```text
          .
          ├── setup.sh                         # 一條龍安裝入口
          ├── manage.sh -> scripts/manage.sh   # 舊版升級相容連結
          ├── update.sh -> scripts/update.sh
          ├── upgrade.sh -> scripts/upgrade.sh
          ├── uninstall.sh -> scripts/uninstall.sh
          ├── doctor.sh -> scripts/doctor.sh
          ├── backup.sh -> scripts/backup.sh
          ├── automations.sh -> scripts/automations.sh
          ├── apple-dashboard.sh -> scripts/apple-dashboard.sh
          ├── scripts/                         # 維護、更新、備份與移除工具
          ''',
          )
          replace_once(
              "README.md",
              '''└── CHANGELOG.md                     # 完整更新紀錄
          ```

          ---
          ''',
              '''└── CHANGELOG.md                     # 完整更新紀錄
          ```

          根目錄的八個腳本是指向 `scripts/` 的相容連結，讓仍使用 0.9.6 升級器的既有安裝能順利跨越目錄調整；新安裝與日常操作不需要直接使用這些連結。

          ---
          ''',
          )

          replace_once(
              "setup.sh",
              '''echo "快速查看狀態：sudo vps-sentinel status"
          echo "一鍵健康檢查：sudo vps-sentinel-doctor"
          echo "日後更新 Home Assistant：sudo vps-sentinel-update"
          echo "日後完整移除：sudo vps-sentinel-uninstall"
          ''',
              '''echo "快速查看狀態：sudo vps-sentinel status"
          echo "一鍵健康檢查：sudo vps-sentinel doctor"
          echo "套用 Apple 面板：sudo vps-sentinel apple --apply"
          echo "更新 VPS Sentinel：sudo vps-sentinel upgrade"
          echo "更新 Home Assistant：sudo vps-sentinel ha-update"
          echo "日後完整移除：sudo vps-sentinel-uninstall"
          ''',
          )

          replace_once(
              "docs/mqtt-vps-setup.md",
              '''# 使用本專案的備份與回退機制更新 Home Assistant
          sudo vps-sentinel-update
          ''',
              '''# 更新 VPS Sentinel 本身
          sudo vps-sentinel upgrade

          # 使用備份與回退機制更新 Home Assistant
          sudo vps-sentinel ha-update
          ''',
          )
          replace_once(
              "docs/mqtt-vps-setup.md",
              '''這份指南適用於以下架構：
          ''',
              '''這份指南適用於以下架構：

          > 一般使用者建議從專案根目錄執行 `sudo bash setup.sh`。第 7 節的 `vps-monitor/install.sh` 是只安裝監控服務的進階／獨立部署方式，不會安裝完整維護指令集或 Home Assistant。
          ''',
          )

          Path("scripts/README.md").write_text(
              '''# 🛠️ 維護腳本

          這個目錄集中存放 VPS Sentinel 的維護、診斷、備份、升級與 Home Assistant 操作工具，讓專案根目錄只保留主要入口與文件。

          一般使用者仍從根目錄的 `setup.sh` 開始安裝。安裝完成後，建議統一使用 `sudo vps-sentinel [指令]`，不需要進入專案目錄或直接執行這裡的腳本。

          | 腳本 | 系統指令 | 用途 |
          | --- | --- | --- |
          | `manage.sh` | `sudo vps-sentinel` | 維護中心與統一指令入口 |
          | `doctor.sh` | `sudo vps-sentinel doctor` | 健康檢查與診斷 |
          | `backup.sh` | `sudo vps-sentinel backup` | 備份、還原與保留策略 |
          | `automations.sh` | 維護中心選單 | Home Assistant 藍圖管理 |
          | `apple-dashboard.sh` | `sudo vps-sentinel apple [--apply]` | Apple 風格面板安裝與套用 |
          | `update.sh` | `sudo vps-sentinel ha-update` | Home Assistant Container 安全更新 |
          | `upgrade.sh` | `sudo vps-sentinel upgrade` | VPS Sentinel 正式版本升級 |
          | `uninstall.sh` | `sudo vps-sentinel-uninstall` | 安全移除工具 |

          ## 🔄 兩種更新不要混用

          - `upgrade` 更新 VPS Sentinel 的監控程式、維護工具與前端元件。
          - `ha-update` 更新 Home Assistant Container 映像。

          根目錄保留同名相容連結，是為了讓 0.9.6 已安裝的舊升級器仍能讀取下一個版本；所有實際來源都以本目錄中的檔案為準。
          ''',
              encoding="utf-8",
          )

          replace_once(
              "vps-monitor/install.sh",
              '''require_integer() {
            local label="$1" value="$2"
            if [[ ! "${value}" =~ ^[0-9]+$ ]]; then
              error "${label} 必須是整數，目前值為：${value}"
              exit 1
            fi
          }
          ''',
              '''require_integer() {
            local label="$1" value="$2"
            if [[ ! "${value}" =~ ^[0-9]+$ ]]; then
              error "${label} 必須是整數，目前值為：${value}"
              exit 1
            fi
          }

          require_percent() {
            local label="$1" value="$2"
            require_number "${label}" "${value}"
            if ! awk -v value="${value}" 'BEGIN { exit !(value >= 1 && value <= 100) }'; then
              error "${label} 必須介於 1 到 100，目前值為：${value}"
              exit 1
            fi
          }
          ''',
          )
          replace_once(
              "vps-monitor/install.sh",
              '''  require_number "CPU 門檻" "${cpu_warn}"
            require_number "記憶體門檻" "${memory_warn}"
            require_number "磁碟門檻" "${disk_warn}"
          ''',
              '''  require_percent "CPU 門檻" "${cpu_warn}"
            require_percent "記憶體門檻" "${memory_warn}"
            require_percent "磁碟門檻" "${disk_warn}"
          ''',
          )
          replace_once(
              "vps-monitor/install.sh",
              '''    echo "# 由 VPS HomeKit 中文安裝器產生：$(date --iso-8601=seconds)"
          ''',
              '''    echo "# 由 VPS Sentinel 中文安裝器產生：$(date --iso-8601=seconds)"
          ''',
          )

          replace_once(
              "tests/test_command_interface.py",
              '''SETUP = (ROOT / "setup.sh").read_text(encoding="utf-8")
          UNINSTALL = (SCRIPTS / "uninstall.sh").read_text(encoding="utf-8")
          ''',
              '''SETUP = (ROOT / "setup.sh").read_text(encoding="utf-8")
          README = (ROOT / "README.md").read_text(encoding="utf-8")
          DOCS = (ROOT / "docs" / "mqtt-vps-setup.md").read_text(encoding="utf-8")
          STANDALONE_INSTALL = (ROOT / "vps-monitor" / "install.sh").read_text(
              encoding="utf-8"
          )
          UNINSTALL = (SCRIPTS / "uninstall.sh").read_text(encoding="utf-8")
          ''',
          )
          replace_once(
              "tests/test_command_interface.py",
              '''

          if __name__ == "__main__":
          ''',
              '''

              def test_unified_command_forwards_apple_apply_argument(self):
                  self.assertIn('shift 2', MANAGE)
                  self.assertIn('if ! "${command}" "$@"; then', MANAGE)
                  self.assertIn(
                      'apple) run_tool "Apple 風格面板" "${APPLE_COMMAND}" "$@" ;;',
                      MANAGE,
                  )
                  self.assertIn('run_command "$@"', MANAGE)
                  self.assertIn("sudo vps-sentinel apple --apply", APPLE_DASHBOARD)
                  self.assertIn("sudo vps-sentinel apple --apply", README)

              def test_root_compatibility_links_support_0_9_6_upgrades(self):
                  names = [
                      "manage.sh", "update.sh", "upgrade.sh", "uninstall.sh",
                      "doctor.sh", "backup.sh", "automations.sh",
                      "apple-dashboard.sh",
                  ]
                  for name in names:
                      with self.subTest(name=name):
                          link = ROOT / name
                          self.assertTrue(link.is_symlink())
                          self.assertEqual(link.readlink(), Path("scripts") / name)
                  self.assertIn("scripts/manage.sh", SENTINEL_UPGRADE)

              def test_installer_and_docs_use_current_command_interface(self):
                  self.assertIn("sudo vps-sentinel doctor", SETUP)
                  self.assertIn("sudo vps-sentinel upgrade", SETUP)
                  self.assertIn("sudo vps-sentinel ha-update", SETUP)
                  self.assertIn("sudo vps-sentinel ha-update", DOCS)
                  self.assertIn("sudo vps-sentinel upgrade", DOCS)

              def test_standalone_installer_validates_percent_ranges(self):
                  self.assertNotIn("VPS HomeKit", STANDALONE_INSTALL)
                  self.assertIn("require_percent()", STANDALONE_INSTALL)
                  for label in ["CPU 門檻", "記憶體門檻", "磁碟門檻"]:
                      self.assertIn(f'require_percent "{label}"', STANDALONE_INSTALL)
                  self.assertIn("value >= 1 && value <= 100", STANDALONE_INSTALL)


          if __name__ == "__main__":
          ''',
          )

          for name in [
              "manage.sh", "update.sh", "upgrade.sh", "uninstall.sh",
              "doctor.sh", "backup.sh", "automations.sh", "apple-dashboard.sh",
          ]:
              link = Path(name)
              if link.exists() or link.is_symlink():
                  link.unlink()
              link.symlink_to(Path("scripts") / name)

      - name: Validate audited repository
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n setup.sh scripts/*.sh vps-monitor/install.sh
          shellcheck setup.sh scripts/*.sh vps-monitor/install.sh
          node --check home-assistant/www/vps-sentinel-apple-card.js
          ruby -e "require 'yaml'; Dir['home-assistant/blueprints/*.yaml'].each { |file| YAML.parse_file(file) }"
          ruby -e 'require "yaml"; source = File.read("scripts/manage.sh"); dashboard = source.match(/cat > "\$\{DASHBOARD_FILE\}" <<YAML\n(.*?)\nYAML/m).captures.first; YAML.parse(dashboard.gsub("${vps_id}", "demo"))'
          python3 -m pip install -r vps-monitor/requirements.txt
          python3 -m unittest discover -s tests -v
          python3 -m py_compile vps-monitor/vps_monitor.py tests/test_vps_monitor.py tests/test_command_interface.py
          git diff --check

      - name: Commit audited fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/apply-project-audit-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve upgrades and align command interface"
          git push origin HEAD:fix/project-audit-2026-07-31
