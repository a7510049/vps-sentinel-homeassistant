name: Prepare v0.9.7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'release/v0.9.7-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.9.7-final
          fetch-depth: 0

      - name: Prepare version files
        shell: python
        run: |
          from pathlib import Path

          old = "0.9.6"
          new = "0.9.7"

          current = Path("VERSION").read_text(encoding="utf-8").strip()
          if current != old:
              raise SystemExit(f"預期版本為 {old}，目前是 {current}")
          Path("VERSION").write_text(f"{new}\n", encoding="utf-8")

          for filename in [
              "scripts/apple-dashboard.sh",
              "tests/test_command_interface.py",
          ]:
              path = Path(filename)
              content = path.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"{filename} 找不到預期版本 {old}")
              path.write_text(content.replace(old, new), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          content = changelog.read_text(encoding="utf-8")
          heading = "## 0.9.7 — 專案更乾淨，指令也更一致"
          if heading not in content:
              section = """## 0.9.7 — 專案更乾淨，指令也更一致

這個版本完成專案結構整理，讓根目錄保持簡潔，同時修正 Apple 面板指令與安裝器驗證，日常維護方式也更加一致。

### 改善

- 維護腳本統一收納至 `scripts/`，根目錄只保留主要安裝入口與專案文件。
- README 改以功能介紹為主，補上清楚的檔案樹、常用指令與兩種更新方式。
- VPS Sentinel 與 Home Assistant 的更新流程改用一致的 `vps-sentinel` 指令入口。
- 獨立監控安裝器統一品牌名稱，並限制 CPU、記憶體與磁碟門檻必須介於 1 到 100。

### 修正

- 修正 `sudo vps-sentinel apple --apply` 未將參數傳給 Apple 面板工具的問題。
- 修正目錄調整後安裝、升級、測試與 CI 仍引用舊腳本位置的問題。
- 移除不再需要的 AI 筆記與舊版相容層，避免專案內容重複或過時。

"""
              marker = "---\n\n"
              if marker not in content:
                  raise SystemExit("CHANGELOG 找不到版本區段插入位置")
              content = content.replace(marker, marker + section, 1)
              changelog.write_text(content, encoding="utf-8")

      - name: Remove one-time workflow
        run: git rm .github/workflows/prepare-v0.9.7.yml

      - name: Validate release candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n setup.sh scripts/*.sh vps-monitor/install.sh
          shellcheck setup.sh scripts/*.sh vps-monitor/install.sh
          node --check home-assistant/www/vps-sentinel-apple-card.js
          ruby -e "require 'yaml'; Dir['home-assistant/blueprints/*.yaml'].each { |file| YAML.parse_file(file) }"
          ruby -e 'require "yaml"; source = File.read("scripts/manage.sh"); dashboard = source.match(/cat > "\$\{DASHBOARD_FILE\}" <<YAML\n(.*?)\nYAML/m).captures.first; YAML.parse(dashboard.gsub("${vps_id}", "demo"))'
          python3 -m pip install -r vps-monitor/requirements.txt
          python3 -m unittest discover -s tests -v
          python3 -m py_compile vps-monitor/vps_monitor.py tests/test_vps_monitor.py tests/test_command_interface.py
          git diff --check
          test "$(cat VERSION)" = "0.9.7"
          grep -q 'RESOURCE_URL="/local/vps-sentinel-apple-card.js?v=0.9.7"' scripts/apple-dashboard.sh

      - name: Commit release preparation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: prepare v0.9.7"
          git push origin HEAD:release/v0.9.7-final
