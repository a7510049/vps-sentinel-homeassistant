name: Apply maintenance notification fix v7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'fix/maintenance-notification-replay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/maintenance-notification-replay
          fetch-depth: 0

      - name: Apply focused patch with explicit indentation
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(
              ".github/workflows/apply-maintenance-notification-fix-v4.yml"
          ).read_text(encoding="utf-8")
          marker = (
              "      - name: Apply focused source patch\n"
              "        shell: python\n"
              "        run: |\n"
          )
          start = workflow.index(marker) + len(marker)
          end = workflow.index(
              "\n      - name: Remove temporary workflow files", start
          )
          lines = workflow[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          )
          exec(compile(script, "maintenance-fix", "exec"), {})

          backend_path = Path("vps-monitor/vps_monitor.py")
          backend = backend_path.read_text(encoding="utf-8")
          discovery_start = backend.index(
              "    if REMOTE_ACTIONS:", backend.index("network_sensors = {")
          )
          discovery_end = backend.index("binaries = {", discovery_start)
          discovery_lines = [
              "    if REMOTE_ACTIONS:",
              "        sensors[\"maintenance_status\"] = config_sensor(",
              "            \"maintenance_status\",",
              "            \"主機維護狀態\",",
              "            icon=\"mdi:tools\",",
              "            topic=MAINTENANCE_STATE,",
              "            value_template=\"{{ value_json.get('state', 'unknown') }}\",",
              "            attributes=\"{{ value_json | tojson }}\",",
              "        )",
              "        event_config = {",
              "            \"name\": \"主機維護事件\",",
              "            \"unique_id\": f\"{VPS_ID}_maintenance_event\",",
              "            \"default_entity_id\": f\"event.{VPS_ID}_maintenance_event\",",
              "            \"state_topic\": MAINTENANCE_EVENT,",
              "            \"event_types\": [",
              "                \"success\",",
              "                \"scheduled\",",
              "                \"failed\",",
              "                \"cooldown\",",
              "                \"busy\",",
              "                \"rejected\",",
              "                \"disabled\",",
              "            ],",
              "            \"availability_topic\": ONLINE,",
              "            \"payload_available\": \"ON\",",
              "            \"payload_not_available\": \"OFF\",",
              "            \"device\": DEVICE,",
              "            \"entity_category\": \"diagnostic\",",
              "            \"icon\": \"mdi:message-alert-outline\",",
              "        }",
              "        client.publish(",
              "            f\"{PREFIX}/event/{VPS_ID}/maintenance_event/config\",",
              "            json.dumps(event_config, ensure_ascii=False),",
              "            qos=1,",
              "            retain=True,",
              "        )",
              "    else:",
              "        client.publish(",
              "            f\"{PREFIX}/sensor/{VPS_ID}/maintenance_status/config\",",
              "            payload=None, qos=1, retain=True,",
              "        )",
              "        client.publish(",
              "            f\"{PREFIX}/event/{VPS_ID}/maintenance_event/config\",",
              "            payload=None, qos=1, retain=True,",
              "        )",
              "    binaries = {",
          ]
          backend = (
              backend[:discovery_start]
              + "\n".join(discovery_lines)
              + backend[discovery_end + len("binaries = {"):]
          )

          callback_start = backend.index(
              "    def on_command(_client, _userdata, message):",
              backend.index("def main():"),
          )
          callback_end_marker = "        wake_on_connect.set()"
          callback_end = backend.index(callback_end_marker, callback_start)
          callback_end += len(callback_end_marker)
          callback_lines = [
              "    def on_command(_client, _userdata, message):",
              "        # Empty retained cleanup messages are housekeeping.",
              "        if not message.payload:",
              "            return",
              "        if message.retain:",
              "            maintenance.publish_event(",
              "                \"rejected\", message=\"已拒絕保留的舊命令\"",
              "            )",
              "            return",
              "        try:",
              "            payload = message.payload.decode(\"utf-8\")",
              "        except UnicodeDecodeError:",
              "            maintenance.publish_event(",
              "                \"rejected\", message=\"命令編碼無效\"",
              "            )",
              "            return",
              "        maintenance.submit(payload)",
              "",
              "    def on_connect(mqtt_client, _userdata, _flags, reason_code, _properties):",
              "        if reason_code != 0:",
              "            print(f\"MQTT 連線遭拒：{reason_code}\", flush=True)",
              "            return",
              "        print(f\"MQTT 已連線：{HOST}:{PORT}\", flush=True)",
              "        publish_discovery(mqtt_client)",
              "        mqtt_client.publish(ONLINE, \"ON\", qos=1, retain=True)",
              "        if REMOTE_ACTIONS:",
              "            mqtt_client.publish(",
              "                COMMAND_TOPIC, payload=None, qos=1, retain=True",
              "            )",
              "            mqtt_client.publish(",
              "                MAINTENANCE_EVENT, payload=None, qos=1, retain=True",
              "            )",
              "            mqtt_client.subscribe(COMMAND_TOPIC, qos=1)",
              "            state, action, request_id = maintenance.snapshot()",
              "            message = (",
              "                \"操作執行中\" if state == \"running\" else \"等待操作\"",
              "            )",
              "            maintenance.publish_state(",
              "                state, action, message, request_id=request_id",
              "            )",
              "        wake_on_connect.set()",
          ]
          backend = (
              backend[:callback_start]
              + "\n".join(callback_lines)
              + backend[callback_end:]
          )
          backend_path.write_text(backend, encoding="utf-8")

      - name: Remove temporary workflow files
        run: |
          git rm .github/workflows/apply-maintenance-notification-fix.yml
          git rm .github/workflows/apply-maintenance-notification-fix-v2.yml
          git rm .github/workflows/apply-maintenance-notification-fix-v3.yml
          git rm .github/workflows/apply-maintenance-notification-fix-v4.yml
          git rm .github/workflows/apply-maintenance-notification-fix-v5.yml
          git rm .github/workflows/apply-maintenance-notification-fix-v6.yml
          git rm .github/workflows/apply-maintenance-notification-fix-v7.yml
          git rm .github/.maintenance-notification-fix-trigger

      - name: Validate focused fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install -r vps-monitor/requirements.txt
          python3 -m unittest discover -s tests -v
          python3 -m py_compile vps-monitor/vps_monitor.py
          node --check home-assistant/www/vps-sentinel-apple-card.js
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          from unittest.mock import patch

          os.environ.setdefault("MQTT_HOST", "127.0.0.1")
          path = Path("vps-monitor/vps_monitor.py")
          spec = importlib.util.spec_from_file_location("monitor", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          class Client:
              def __init__(self):
                  self.messages = []
              def publish(self, topic, payload, **kwargs):
                  self.messages.append((topic, json.loads(payload), kwargs))

          client = Client()
          controller = module.MaintenanceController(
              client, enabled=True, clock=lambda: 1000, wall_clock=lambda: 2000
          )
          controller.last_started["refresh"] = 1000
          payload = json.dumps({
              "action": "refresh",
              "request_id": "live-request",
              "issued_at": 2000000,
          })
          assert controller.submit(payload) is False
          topic, event, options = client.messages[-1]
          assert topic == module.MAINTENANCE_EVENT
          assert event["event_type"] == "cooldown"
          assert event["request_id"] == "live-request"
          assert options["retain"] is False

          client.messages.clear()
          with patch.object(module, "maintenance_result", return_value=(True, "完成")):
              controller.last_started.clear()
              controller._execute("refresh", "completed-request")
          assert client.messages[0][0] == module.MAINTENANCE_STATE
          assert client.messages[0][1]["state"] == "running"
          assert client.messages[0][2]["retain"] is True
          assert client.messages[1][0] == module.MAINTENANCE_EVENT
          assert client.messages[1][1]["event_type"] == "success"
          assert client.messages[1][1]["request_id"] == "completed-request"
          assert client.messages[1][2]["retain"] is False
          assert client.messages[2][1]["state"] == "idle"
          assert client.messages[2][2]["retain"] is True

          card = Path("home-assistant/www/vps-sentinel-apple-card.js").read_text()
          assert "_matchingMaintenanceEvent" in card
          assert "attributes.request_id !== request.requestId" in card
          assert "!transientStates.has(backendState)" in card
          assert "localStorage" not in card
          PY
          git diff --check

      - name: Commit focused fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: prevent stale maintenance notifications after reload"
          git push origin HEAD:fix/maintenance-notification-replay
