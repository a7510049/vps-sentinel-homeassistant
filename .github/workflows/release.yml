name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed

permissions:
  contents: write
  issues: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect VERSION change
        id: version_change
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet "${HEAD_SHA}^" "${HEAD_SHA}" -- VERSION; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Read and validate version
        if: steps.version_change.outputs.changed == 'true'
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "VERSION 格式無效：${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-rc.* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check release consistency
        if: steps.version_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          card_version="$(sed -n 's/^const CARD_VERSION = "\([^"]*\)";.*/\1/p' \
            home-assistant/www/vps-sentinel-apple-card.js | head -n 1)"
          [[ "${card_version}" == "${version}" ]]
          grep -Fq "## ${version} — " CHANGELOG.md
          grep -q 'VERSION_FILE="/opt/vps-monitor/.version"' \
            scripts/apple-dashboard.sh

      - name: Check 1.0 evidence gate
        if: steps.version_change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          GATE_ISSUE: "65"
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "${VERSION}" =~ ^1\.0\.0(-rc\.[1-9][0-9]*)?$ ]]; then
            exit 0
          fi

          gate_json="$(gh issue view "${GATE_ISSUE}" \
            --repo "${GITHUB_REPOSITORY}" --json state,body)"
          gate_state="$(jq -r '.state' <<< "${gate_json}")"
          if [[ "${gate_state}" != "CLOSED" ]]; then
            echo "1.0 發布 Gate #${GATE_ISSUE} 尚未關閉。" >&2
            exit 1
          fi

          unchecked="$(jq -r '.body' <<< "${gate_json}" |
            grep -Ec '^- \[ \] ' || true)"
          if (( unchecked > 0 )); then
            echo "1.0 發布 Gate #${GATE_ISSUE} 仍有 ${unchecked} 項未完成。" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        if: steps.version_change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "${TAG} 已存在，略過重複發布。"
            exit 0
          fi

          release_heading="$(awk -v version="${VERSION}" '
            index($0, "## " version " — ") == 1 { print; exit }
          ' CHANGELOG.md)"
          if [[ -z "${release_heading}" ]]; then
            echo "CHANGELOG.md 找不到 ${VERSION} 的版本標題。" >&2
            exit 1
          fi

          release_theme="${release_heading#* — }"
          release_title="VPS Sentinel v${VERSION}"
          notes_file="$(mktemp)"
          trap 'rm -f -- "${notes_file}"' EXIT
          printf '## %s\n\n' "${release_theme}" > "${notes_file}"
          awk -v version="${VERSION}" '
            index($0, "## " version " — ") == 1 {
              capture = 1
              next
            }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md >> "${notes_file}"

          if ! grep -q '[^[:space:]]' "${notes_file}"; then
            echo "CHANGELOG.md 的 ${VERSION} 版本說明為空。" >&2
            exit 1
          fi

          release_args=(
            release create "${TAG}"
            --target "${TARGET_SHA}"
            --title "${release_title}"
            --notes-file "${notes_file}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh "${release_args[@]}"
