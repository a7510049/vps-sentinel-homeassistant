name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n setup.sh vps-monitor/install.sh

      - name: Run ShellCheck on one-stop installer
        run: shellcheck setup.sh

      - name: Check Python syntax
        run: python3 -m py_compile vps-monitor/vps_monitor.py
