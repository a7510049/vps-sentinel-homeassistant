name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check shell syntax
        run: bash -n setup.sh update.sh upgrade.sh uninstall.sh manage.sh doctor.sh backup.sh automations.sh vps-monitor/install.sh

      - name: Run ShellCheck
        run: shellcheck setup.sh update.sh upgrade.sh uninstall.sh manage.sh doctor.sh backup.sh automations.sh vps-monitor/install.sh

      - name: Check Blueprint YAML syntax
        run: ruby -e "require 'yaml'; Dir['home-assistant/blueprints/*.yaml'].each { |file| YAML.parse_file(file) }"

      - name: Check dashboard YAML syntax
        run: >-
          ruby -e 'require "yaml";
          source = File.read("manage.sh");
          dashboard = source.match(/cat > "\$\{DASHBOARD_FILE\}" <<YAML\n(.*?)\nYAML/m).captures.first;
          YAML.parse(dashboard.gsub("${vps_id}", "demo"))'

      - name: Install Python dependencies
        run: python3 -m pip install -r vps-monitor/requirements.txt

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Python syntax
        run: >-
          python3 -m py_compile
          vps-monitor/vps_monitor.py
          tests/test_vps_monitor.py
          tests/test_command_interface.py
